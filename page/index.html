<title>Worklog</title>
<style>
  /* Layout: one search box over three collapsible recency tiers; each Work Item is a wrapping grid row. */
  :root {
    --bg:#fbfaf8; --fg:#1d1c1a; --muted:#6b6862; --line:#e6e2db; --chip:#efece6; --accent:#3b5bdb;
    --s-progress:#3b5bdb; --s-blocked:#c92a2a; --s-review:#b35c00; --s-done:#2b8a3e; --s-abandoned:#6c737a;
    --danger:#c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#161513; --fg:#ece9e4; --muted:#a19d96; --line:#2c2a27; --chip:#24221f; --accent:#7c9bff;
      --s-progress:#7c9bff; --s-blocked:#ff8787; --s-review:#ffa94d; --s-done:#69db7c; --s-abandoned:#adb5bd;
      --danger:#ff8787; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#161513; --fg:#ece9e4; --muted:#a19d96; --line:#2c2a27; --chip:#24221f; --accent:#7c9bff;
    --s-progress:#7c9bff; --s-blocked:#ff8787; --s-review:#ffa94d; --s-done:#69db7c; --s-abandoned:#adb5bd;
    --danger:#ff8787; color-scheme: dark;
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding-block:24px 64px; padding-inline:16px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; }
  h1 { margin:0; font-size:1.5rem; }
  input[type=search] { box-sizing:border-box; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--chip); color:var(--fg); font:inherit; margin-block:16px 8px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:end; margin-block:0 16px; }
  .filters label { display:grid; gap:2px; font-size:12px; color:var(--muted); }
  .filters select, .filters input[type=date] { box-sizing:border-box; min-height:32px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--chip); color:var(--fg); font:inherit; font-size:13px; }
  .filters button { min-height:32px; }
  @media (max-width: 720px) { .filters label { flex:1 1 140px; } .filters select, .filters input[type=date] { width:100%; } }
  main > details { border-top:1px solid var(--line); padding-block:8px; }
  main > details > summary { cursor:pointer; font-weight:600; padding-block:6px; }
  main > details > summary::after { content:" (" attr(data-count) ")"; font-weight:400; color:var(--muted); }
  .rows { display:grid; gap:8px; margin-top:8px; }
  .row { display:grid; grid-template-columns: 2fr auto 3fr auto 2fr auto; gap:12px; align-items:start; padding-block:10px; border-bottom:1px solid var(--line); }
  .row > * { min-width:0; overflow-wrap:anywhere; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr auto; } .row > .phrase, .row > .where { grid-column: 1 / -1; } }
  .branch, .meta { color:var(--muted); font-size:12px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--chip); white-space:nowrap; }
  .chip[data-s="in progress"] { color:var(--s-progress); } .chip[data-s="blocked"] { color:var(--s-blocked); }
  .chip[data-s="awaiting review"] { color:var(--s-review); } .chip[data-s="done"] { color:var(--s-done); } .chip[data-s="abandoned"] { color:var(--s-abandoned); }
  button { font:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; padding:2px 8px; cursor:pointer; }
  button.danger { color:var(--danger); border-color:var(--danger); }
  button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); } code { font-size:12px; word-break:break-all; }
  .notice { color:var(--muted); padding-block:24px; }
</style>
<main>
  <header><h1>Worklog</h1><span class="meta" id="count"></span></header>
  <input type="search" id="q" placeholder="Search Work Items, branches, tickets, Session IDs…" aria-label="Search the Worklog">
  <div class="filters" role="group" aria-label="Filter the Worklog">
    <label>Status<select id="f-status">
      <option value="">All</option><option>in progress</option><option>blocked</option>
      <option>awaiting review</option><option>done</option><option>abandoned</option>
    </select></label>
    <label>Repository<select id="f-repo"><option value="">All</option></select></label>
    <label>Active from<input type="date" id="f-from"></label>
    <label>Active to<input type="date" id="f-to"></label>
    <button type="button" id="f-clear" hidden>Clear filters</button>
  </div>
  <div id="notice" class="notice">Loading your Worklog…</div>
  <details id="week" open><summary>This week</summary><div class="rows"></div></details>
  <details id="month"><summary>Last 30 days</summary><div class="rows"></div></details>
  <details id="older"><summary>All time</summary><div class="rows"></div></details>
</main>
<script type="module">
  import { buildView, displayTitle, whereOf, repoOptions } from './view-model.js';

  let rows = [];
  let db = null;
  const q = document.getElementById('q');
  const fStatus = document.getElementById('f-status');
  const fRepo = document.getElementById('f-repo');
  const fFrom = document.getElementById('f-from');
  const fTo = document.getElementById('f-to');
  const fClear = document.getElementById('f-clear');
  // Date inputs give local calendar days; "to" includes its whole day.
  const dayStart = (v) => (v ? new Date(`${v}T00:00`).getTime() : null);
  const dayAfter = (v) => { if (!v) return null; const d = new Date(`${v}T00:00`); d.setDate(d.getDate() + 1); return d.getTime(); };
  const notice = document.getElementById('notice');
  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'text' ? (node.textContent = v) : node.setAttribute(k, v);
    node.append(...kids.filter(Boolean));
    return node;
  };
  const isHttp = (u) => typeof u === 'string' && /^https?:\/\//.test(u);
  const when = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

  function rowNode(r) {
    const where = whereOf(r);
    const title = el('div', {}, el('div', { text: displayTitle(r) }),
      el('div', { class: 'branch' }, r.branch || '', r.ticket ? ' · ' : '',
        r.ticket ? (isHttp(r.ticketUrl) ? el('a', { href: r.ticketUrl, target: '_blank', rel: 'noopener', text: r.ticket }) : r.ticket) : ''));
    const sessions = el('details', { class: 'meta' }, el('summary', { text: `Sessions: ${r.sessions?.length ?? 0}` }),
      ...(r.sessions ?? []).map((s) => el('div', {}, el('code', { text: s.id }))));
    let whereNode;
    if (where.kind === 'archive') {
      whereNode = el('div', { class: 'where' }, el('div', { class: 'meta', text: 'Archived Transcript' }), el('code', { text: where.path }));
    } else {
      const copy = el('button', { type: 'button', text: 'Copy resume' });
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(where.resumeCommand); copy.textContent = 'Copied'; }
        catch { copy.textContent = 'Copy failed'; }
        setTimeout(() => (copy.textContent = 'Copy resume'), 1500);
      });
      whereNode = el('div', { class: 'where' }, el('div', { text: where.displayName || '' }), el('code', { text: where.path }),
        el('div', {}, where.resumeCommand ? copy : null, isHttp(where.prUrl) ? el('a', { href: where.prUrl, target: '_blank', rel: 'noopener', text: ' PR' }) : null));
    }
    // The viewer never shows confirm(), so the button asks for a second click instead.
    const del = el('button', { type: 'button', text: 'Delete', 'aria-label': `Delete ${displayTitle(r)} from the Worklog` });
    let armed = null;
    del.addEventListener('click', async () => {
      if (!db) return;
      if (!armed) {
        del.textContent = 'Confirm delete (transcript stays on disk)';
        del.classList.add('danger');
        armed = setTimeout(() => { armed = null; del.textContent = 'Delete'; del.classList.remove('danger'); }, 5000);
        return;
      }
      clearTimeout(armed);
      try { await db.doc(`workItems/${r.id}`).update({ deleted: true, deletedAt: new Date().toISOString() }); }
      catch (e) { armed = null; del.textContent = `Could not delete (${e?.code ?? 'error'})`; }
    });
    return el('div', { class: 'row' }, title, el('span', { class: 'chip', 'data-s': r.status, text: r.status }),
      el('div', { class: 'phrase', text: r.phrase || '' }), el('div', { class: 'meta', text: when(r.lastActiveAt) }),
      whereNode, el('div', {}, sessions, db ? del : null));
  }

  function syncRepoOptions() {
    const current = fRepo.value;
    const repos = repoOptions(rows);
    if (current && !repos.includes(current)) repos.push(current);
    fRepo.replaceChildren(el('option', { value: '', text: 'All' }), ...repos.map((r) => el('option', { value: r, text: r })));
    fRepo.value = current;
  }

  function render() {
    const query = q.value.trim();
    const view = buildView(rows, {
      query, now: Date.now(), status: fStatus.value, repo: fRepo.value, since: dayStart(fFrom.value), until: dayAfter(fTo.value),
    });
    const filtered = query || fStatus.value || fRepo.value || fFrom.value || fTo.value;
    fClear.hidden = !filtered;
    document.getElementById('count').textContent = filtered ? `${view.shown} of ${view.total} Work Items` : `${view.total} Work Items`;
    for (const tier of ['week', 'month', 'older']) {
      const section = document.getElementById(tier);
      section.querySelector('.rows').replaceChildren(...view[tier].map(rowNode));
      section.querySelector('summary').dataset.count = view[tier].length;
      if (filtered) section.open = view[tier].length > 0;
    }
    notice.hidden = rows.length > 0;
    if (!rows.length && db) notice.textContent = 'No Work Items yet. Run /worklog in Claude Code.';
  }

  q.addEventListener('input', render);
  for (const f of [fStatus, fRepo, fFrom, fTo]) f.addEventListener('change', render);
  fClear.addEventListener('click', () => {
    q.value = fStatus.value = fRepo.value = fFrom.value = fTo.value = '';
    render();
  });
  render();

  claude.use('db').then((handle) => {
    db = handle;
    if (!db) { notice.textContent = 'Open this page in claude.ai, signed in, to load your Worklog.'; return; }
    db.collection('workItems').onSnapshot(
      (snap) => { rows = snap.docs.map((d) => ({ id: d.id, ...d.data() })); syncRepoOptions(); render(); },
      (err) => { notice.hidden = false; notice.textContent = `Could not load the Worklog (${err?.code ?? 'error'}).`; },
    );
  }).catch((err) => { notice.hidden = false; notice.textContent = `Could not load the Worklog (${err?.code ?? 'error'}).`; });
</script>
